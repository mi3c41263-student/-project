<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO愛搜查 - VR 資安教育訓練系統</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="left-panel">
        <img src="logo.png" alt="ISO愛搜查 Logo" class="brand-logo">
        <h1>VR 資安教育訓練系統</h1>
        <p>沉浸式VR體驗，將抽象的資安規範轉化為實際防禦行為。</p>
    </div>

    <div class="right-panel">
        <div id="particles-js"></div>

        <div class="login-container" data-tilt data-tilt-max="3" data-tilt-speed="400" data-tilt-glare="true" data-tilt-max-glare="0.1">
            <h2>系統登入</h2>
            <form id="loginForm" action="#" method="POST">
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user"></i> 帳號</label>
                    <input type="text" id="username" name="username" placeholder="請輸入使用者名稱或電子郵件" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> 密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="請輸入密碼" required>
                        <i class="fa-solid fa-eye-slash" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember"> <span>記住我</span>
                    </label>
                    <a href="#" id="forgotPwdLink" class="forgot-link">忘記密碼？</a>
                </div>

                <button type="submit" class="btn-login">
                    登入系統 <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
                
                <div class="register-hint">
                    尚未建立人員資料？ <a href="#" id="registerLink">立即註冊</a>
                </div>
            </form>

            <div class="system-footer">
                &copy; 2026 ISO愛搜查 專題團隊 版權所有
            </div>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeRegister">&times;</span>
            <h3>註冊新帳號</h3>
            <form id="registerForm">
                <div class="form-group">
                    <label>新帳號</label>
                    <input type="text" id="regUsername" placeholder="請設定帳號" required>
                </div>
                
                <div class="form-group">
                    <label>新密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" placeholder="至少 8 碼，包含大小寫英文字母與數字" required>
                        <i class="fa-solid fa-eye-slash" id="toggleRegPassword"></i>
                    </div>
                </div>
                <button type="submit" class="btn-login">確認註冊</button>
            </form>
        </div>
    </div>

    <div id="forgotPwdModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeForgotPwd">&times;</span>
            <h3>找回密碼</h3>
            <p style="margin-bottom: 15px; color: #a0aec0; font-size: 0.9rem;">請輸入您的電子郵件，我們將發送重置密碼的連結給您。</p>
            <form id="forgotPwdForm">
                <div class="form-group">
                    <label>電子郵件</label>
                    <input type="email" id="resetEmail" placeholder="example@email.com" required>
                </div>
                <button type="submit" class="btn-login">發送重置連結</button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
