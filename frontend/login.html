<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO愛搜查 - VR 資安教育訓練系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css?v=1783090574031">
<script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>

    <button id="themeToggleBtn" class="theme-toggle-btn" style="position: absolute; top: 20px; right: 20px; z-index: 1000; background: transparent; color: #00f3ff; border: 2px solid #00f3ff; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 10px rgba(0,243,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>
    <div id="grid-background"></div>
    <div class="auth-container" id="authContainer">
        
        <div class="form-container sign-in-container">
            <form id="loginForm">
                <h2 class="form-title">登入</h2>
                <div class="form-group">
                    <label>電子郵件</label>
                    <div class="input-line">
                        <input type="email" id="username" placeholder="請輸入您的電子郵件" required>
                        <i class="fa-solid fa-envelope icon-right"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <div class="input-line">
                        <input type="password" id="password" placeholder="請輸入您的密碼" required>
                        <i class="fa-solid fa-lock icon-right"></i>
                        <i class="fa-solid fa-eye-slash toggle-eye" id="togglePassword"></i>
                    </div>
                </div>
                <div class="form-options">
                    
                    <a href="#" id="forgotPwdLink" class="forgot-link">忘記密碼？</a>
                </div>
                <button type="submit" class="btn-login">登入</button>
                <div class="switch-hint">還沒有帳號嗎？ <span class="switch-btn" id="toRegisterBtn">按此註冊</span></div>
            </form>
        </div>

        <div class="form-container sign-up-container">
            <form id="registerForm">
                <h2 class="form-title">註冊</h2>
                <div class="form-group">
                    <label>電子郵件</label>
                    <div class="input-line">
                        <input type="email" id="regUsername" placeholder="請輸入您的電子郵件" required>
                        <i class="fa-solid fa-envelope icon-right"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <div class="input-line">
                        <input type="password" id="regPassword" placeholder="請輸入您的密碼" required>
                        <i class="fa-solid fa-key icon-right"></i>
                        <i class="fa-solid fa-eye-slash toggle-eye" id="toggleRegPassword"></i>
                    </div>
                    <ul id="pwdCriteria" class="pwd-criteria" style="display: none;">
                        <li id="rule-length" class="invalid"><i class="fa-solid fa-circle"></i> 至少 8 碼</li>
                        <li id="rule-case" class="invalid"><i class="fa-solid fa-circle"></i> 包含大小寫</li>
                        <li id="rule-number" class="invalid"><i class="fa-solid fa-circle"></i> 包含數字</li>
                        <li id="rule-special" class="invalid"><i class="fa-solid fa-circle"></i> 包含特殊符號</li>
                                        </ul>
                </div>
                <div class="terms-group" style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
                    <input type="checkbox" id="agreeTerms" required style="width: 16px; height: 16px; accent-color: #00a8ff; cursor: pointer;">
                    <label for="agreeTerms" style="font-size: 0.85rem; color: var(--text-muted, #94a3b8); cursor: pointer;">
                        我已閱讀並同意 <a href="terms.html" target="_blank" style="color: #00a8ff; text-decoration: none;">服務條款</a> 與 <a href="privacy.html" target="_blank" style="color: #00a8ff; text-decoration: none;">隱私權政策</a>
                    </label>
                </div>
                <button type="submit" class="btn-login" style="margin-top: 15px;">註冊</button>
                <div class="switch-hint">已經有帳號了嗎？ <span class="switch-btn" id="toLoginBtn">按此登入</span></div>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <div class="content-wrapper text-left">
                        <img src="logo.png" class="brand-logo">
                        <h1 class="glow-text">WELCOME!</h1>
                        <p class="welcome-desc">建立您的帳號，開始資安防禦訓練旅程。</p>
                    </div>
                </div>
                <div class="overlay-panel overlay-right">
                    <div class="content-wrapper text-right">
                        <img src="logo.png" class="brand-logo">
                        <h1 class="glow-text">WELCOME BACK!</h1>
                        <p class="welcome-desc">VR資安教育系統，將抽象規範轉化為防禦行為。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 忘記密碼 Modal -->
    <div id="forgotPwdModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeForgotPwd">&times;</span>
            <h3>找回密碼</h3>
            <p class="modal-desc">請輸入您的電子郵件，我們將發送重置密碼的連結給您。</p>
            <form id="forgotPwdForm">
                <div class="form-group">
                    <label>電子郵件</label>
                    <div class="input-line">
                        <input type="email" id="forgotEmail" placeholder="example@email.com" required>
                    </div>
                </div>
                <button type="submit" class="btn-forgot-submit">發送重置連結</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="login.js?v=1783960210367"></script>
</body>
</html>
