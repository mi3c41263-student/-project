<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO愛搜查 - VR 資安教育訓練系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div id="grid-background"></div>
    <div class="auth-container" id="authContainer">
        
        <div class="form-container sign-in-container">
            <form id="loginForm">
                <h2 class="form-title">登入</h2>
                <div class="form-group">
                    <label>電子郵件</label>
                    <div class="input-line">
                        <input type="email" id="username" placeholder="請輸入您的電子郵件" required>
                        <i class="fa-solid fa-envelope icon-right"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <div class="input-line">
                        <input type="password" id="password" placeholder="請輸入您的密碼" required>
                        <i class="fa-solid fa-lock icon-right"></i>
                        <i class="fa-solid fa-eye-slash toggle-eye" id="togglePassword"></i>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me"><input type="checkbox" id="remember"> <span>記住我</span></label>
                    <a href="#" id="forgotPwdLink" class="forgot-link">忘記密碼？</a>
                </div>
                <button type="submit" class="btn-login">登入</button>
                <div class="switch-hint">還沒有帳號嗎？ <span class="switch-btn" id="toRegisterBtn">按此註冊</span></div>
            </form>
        </div>

        <div class="form-container sign-up-container">
            <form id="registerForm">
                <h2 class="form-title">註冊</h2>
                <div class="form-group">
                    <label>電子郵件</label>
                    <div class="input-line">
                        <input type="email" id="regUsername" placeholder="請輸入您的電子郵件" required>
                        <i class="fa-solid fa-envelope icon-right"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <div class="input-line">
                        <input type="password" id="regPassword" placeholder="請輸入您的密碼" required>
                        <i class="fa-solid fa-key icon-right"></i>
                        <i class="fa-solid fa-eye-slash toggle-eye" id="toggleRegPassword"></i>
                    </div>
                    <ul id="pwdCriteria" class="pwd-criteria" style="display: none;">
                        <li id="rule-length" class="invalid"><i class="fa-solid fa-circle"></i> 至少 8 碼</li>
                        <li id="rule-case" class="invalid"><i class="fa-solid fa-circle"></i> 包含大小寫</li>
                        <li id="rule-number" class="invalid"><i class="fa-solid fa-circle"></i> 包含數字</li>
                    </ul>
                </div>
                <button type="submit" class="btn-login" style="margin-top: 15px;">註冊</button>
                <div class="switch-hint">已經有帳號了嗎？ <span class="switch-btn" id="toLoginBtn">按此登入</span></div>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <div class="content-wrapper text-left">
                        <img src="logo.png" class="brand-logo">
                        <h1 class="glow-text">WELCOME!</h1>
                        <p class="welcome-desc">建立您的帳號，開始資安防禦訓練旅程。</p>
                    </div>
                </div>
                <div class="overlay-panel overlay-right">
                    <div class="content-wrapper text-right">
                        <img src="logo.png" class="brand-logo">
                        <h1 class="glow-text">WELCOME<br>BACK!</h1>
                        <p class="welcome-desc">VR資安教育系統，將抽象規範轉化為防禦行為。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 忘記密碼 Modal -->
    <div id="forgotPwdModal" class="modal" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.7); backdrop-filter:blur(5px); justify-content:center; align-items:center;">
        <div class="modal-content" style="background-color:#0b101e; border:1px solid rgba(0,243,255,0.4); padding:40px; border-radius:12px; width:90%; max-width:420px; position:relative; box-shadow:0 10px 40px rgba(0,0,0,0.6);">
            <span class="close-btn" id="closeForgotPwd" style="position:absolute; top:15px; right:20px; font-size:28px; font-weight:bold; color:#8892b0; cursor:pointer;">&times;</span>
            <h3 style="font-size:1.8rem; margin-bottom:20px; color:#ffffff;">找回密碼</h3>
            <p style="margin-bottom:15px; color:#a0aec0; font-size:0.9rem;">請輸入您的電子郵件，我們將發送重置密碼的連結給您。</p>
            <form id="forgotPwdForm">
                <div class="form-group" style="margin-bottom:20px;">
                    <label style="display:block; font-size:14px; color:#e2e8f0; margin-bottom:8px;">電子郵件</label>
                    <div class="input-line" style="position:relative; border-bottom:2px solid #e2e8f0; padding-bottom:8px;">
                        <input type="email" id="forgotEmail" placeholder="example@email.com" required style="width:90%; background:transparent; border:none; color:#fff; font-size:16px; outline:none;">
                    </div>
                </div>
                <button type="submit" class="btn-login" style="width:100%; padding:14px; border-radius:30px; background:linear-gradient(180deg, #18b5b5, #004455); border:1px solid rgba(0,243,255,0.6); color:#fff; font-size:16px; font-weight:bold; cursor:pointer;">發送重置連結</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="login.js"></script>
</body>
</html>
