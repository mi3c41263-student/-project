<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設密碼 - VR 資安教育訓練系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ================= 基礎全域設定 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #111520; /* 極深的科技藍黑底色 */
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 背景的微光暈，模擬你截圖左側的發光感 */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 132, 255, 0.08) 0%, rgba(17, 21, 32, 0) 70%);
            top: 10%;
            left: 5%;
            z-index: -1;
        }

        /* ================= 粒子背景容器 ================= */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* ================= 卡片樣式 (與截圖完全一致) ================= */
        .reset-card {
            background-color: #171f2e; /* 截圖中的深藍卡片底色 */
            /* 模擬截圖中微微發光的藍色邊框 */
            border: 1px solid #23395d;
            border-radius: 12px;
            padding: 40px 35px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(0, 132, 255, 0.15);
            z-index: 1;
        }

        .reset-card h2 {
            margin-bottom: 25px;
            color: #ffffff;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-align: left; /* 截圖中的標題是靠左的 */
            font-weight: 600;
        }

        /* ================= 輸入框設定 ================= */
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* 標籤旁邊的藍色小圖示 */
        .form-group label i {
            color: #0084ff;
            margin-right: 8px;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border-radius: 6px;
            border: 1px solid #2a3a50; /* 較暗的邊框 */
            background-color: #1c2638; /* 輸入框底色比卡片稍淺一點 */
            color: #e2e8f0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input::placeholder {
            color: #64748b;
            font-size: 0.85rem;
        }

        .form-group input:focus {
            border-color: #0084ff;
            box-shadow: 0 0 0 1px #0084ff;
        }

        /* 眼睛圖示 (密碼切換) */
        .toggle-pwd {
            position: absolute;
            right: 15px;
            top: 40px;
            color: #64748b;
            cursor: pointer;
            transition: color 0.3s;
            font-size: 0.9rem;
        }

        .toggle-pwd:hover {
            color: #e2e8f0;
        }

        /* ================= 按鈕設定 (與截圖的純藍色一致) ================= */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0084ff; /* 截圖中的明亮科技藍 */
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px; /* 文字與圖示的間距 */
        }

        .btn-submit:hover {
            background-color: #006bce;
        }

        .btn-submit:disabled {
            background-color: #2a3a50;
            color: #64748b;
            cursor: not-allowed;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div id="particles-js"></div>

    <div class="reset-card">
        <h2>重設密碼</h2>
        
        <form id="resetPwdForm">
            <div class="form-group">
                <label for="newPassword"><i class="fa-solid fa-lock"></i> 新密碼</label>
                <input type="password" id="newPassword" placeholder="至少8碼，含大小寫與數字" required>
                <i class="fa-solid fa-eye-slash toggle-pwd" id="toggleNewPwd"></i>
            </div>

            <div class="form-group">
                <label for="confirmPassword"><i class="fa-solid fa-lock"></i> 確認密碼</label>
                <input type="password" id="confirmPassword" placeholder="請再次輸入新密碼" required>
                <i class="fa-solid fa-eye-slash toggle-pwd" id="toggleConfirmPwd"></i>
                <div id="pwdError" class="error-msg">兩次輸入的密碼不一致</div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                確認重設 <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 1. 抓取網址上的 Token
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                alert("無效的連結！缺少安全憑證。");
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('submitBtn').innerHTML = "連結無效";
                document.getElementById('newPassword').disabled = true;
                document.getElementById('confirmPassword').disabled = true;
            }

            // 2. 密碼顯示 / 隱藏切換
            function setupToggle(eyeIconId, inputId) {
                const icon = document.getElementById(eyeIconId);
                const input = document.getElementById(inputId);
                
                icon.addEventListener("click", function () {
                    const isPassword = input.type === "password";
                    input.type = isPassword ? "text" : "password";
                    this.classList.toggle("fa-eye");
                    this.classList.toggle("fa-eye-slash");
                });
            }

            setupToggle("toggleNewPwd", "newPassword");
            setupToggle("toggleConfirmPwd", "confirmPassword");

            // 3. 表單送出邏輯
            const resetForm = document.getElementById('resetPwdForm');
            const submitBtn = document.getElementById('submitBtn');
            const pwdError = document.getElementById('pwdError');

            resetForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (newPassword !== confirmPassword) {
                    pwdError.style.display = "block";
                    return;
                } else {
                    pwdError.style.display = "none";
                }

                const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
                if (!passwordRegex.test(newPassword)) {
                    alert("密碼強度不足！需包含大小寫英文字母、數字，且至少8碼。");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 處理中...';

                try {
                    const response = await fetch('http://localhost:3000/api/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token, newPassword: newPassword })
                    });

                    const data = await response.json();

                    if (data.success) {
                        alert("✨ " + data.message);
                        window.location.href = "login.html"; // 成功跳轉
                    } else {
                        alert("❌ " + data.message);
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '確認重設 <i class="fa-solid fa-arrow-right-to-bracket"></i>';
                    }
                } catch (error) {
                    console.error("錯誤:", error);
                    alert("伺服器連線失敗，請確認 Node.js 是否正在運行。");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '確認重設 <i class="fa-solid fa-arrow-right-to-bracket"></i>';
                }
            });
        });
    </script>
</body>
</html>
